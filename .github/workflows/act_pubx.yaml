# act-pubx-workflow: v2 variant=dev sha256=ec6cd22eff540f94
name: act-pubx session runner

on:
  workflow_dispatch:
    inputs:
      payload_ct:
        description: 'base64(S/MIME RSA+AES encrypted payload)'
        required: true
      os:
        description: 'runner os'
        required: false
        default: 'ubuntu-latest'
      timeout:
        description: '有效工作时长(分钟); 步骤内软超时用它, 之后另留 20 分钟归档加密缓存'
        required: false
        default: '240'
      job_timeout:
        description: 'job 硬上限(分钟) = 有效工作时长 + 20(备份窗口); 由 act-pubx 算好传入'
        required: false
        default: '260'
      cache:
        description: '1=启用加密缓存(~/local-cache); 0=关闭'
        required: false
        default: '1'

jobs:
  run:
    runs-on: ${{ github.event.inputs.os || 'ubuntu-latest' }}
    # = 有效工作时长 + 20 分钟备份窗口; 6h 硬上限封顶 360(GHA 表达式无算术运算符, 只能比较)
    timeout-minutes: "${{ fromJSON(github.event.inputs.job_timeout || 260) > 360 && 360 || fromJSON(github.event.inputs.job_timeout || 260) }}"
    steps:
      - name: 准备(解密钥 / 取公钥 / 解出载荷)
        id: prep
        env:
          ACT_PUBX_KEY_PEM: ${{ secrets.ACT_PUBX_KEY }}
          ACT_PUBX_PAYLOAD: ${{ github.event.inputs.payload_ct }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/actkey"; mkdir -p "$K"; chmod 700 "$K"
          printf '%s\n' "$ACT_PUBX_KEY_PEM" > "$K/key.pem"; chmod 600 "$K/key.pem"
          # 公钥在 repo 文件里(公开无害), 用来包装缓存密钥; 取不到就本轮不做缓存
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" -o "$K/cert.pem" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.act_pubx.pub?ref=$GITHUB_REF_NAME" \
            || curl -fsS -o "$K/cert.pem" \
                 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/.act_pubx.pub" \
            || echo "::warning::取公钥失败 → 本轮不做缓存(会话不受影响)"
          D="$RUNNER_TEMP/actx"; mkdir -p "$D"
          printf '%s' "$ACT_PUBX_PAYLOAD" | base64 -d > "$D/p.ct"
          openssl smime -decrypt -binary -inform DER \
            -inkey "$K/key.pem" -in "$D/p.ct" -out "$D/p.sh"
          chmod 700 "$D/p.sh"
          # 缓存暂存目录: 优先 /mnt(大分区, 3-5GB 级靠得住), 不行退回 $HOME
          CD=""
          if sudo mkdir -p /mnt/actcache 2>/dev/null && sudo chown "$(id -u):$(id -g)" /mnt/actcache 2>/dev/null; then
            CD=/mnt/actcache
          fi
          [ -n "$CD" ] || CD="$HOME/actcache"
          mkdir -p "$CD"
          echo "cachedir=$CD" >> "$GITHUB_OUTPUT"
          echo "就绪: 密钥 $K, 载荷 $D/p.sh, 缓存目录 $CD"

      - name: 启动会话(后台; 不阻塞, 缓存随下载并行)
        env:
          WORK_MIN: ${{ github.event.inputs.timeout || 240 }}
        run: |
          set -uo pipefail
          case "$WORK_MIN" in ''|*[!0-9]*) WORK_MIN=240 ;; esac
          if [ "$WORK_MIN" -gt 340 ]; then
            echo "warn: 有效时长 ${WORK_MIN}min 超出 340(6h 硬上限留 20min 备份), 收敛为 340"
            WORK_MIN=340
          fi
          [ "$WORK_MIN" -lt 1 ] && WORK_MIN=1
          SOFT_SEC=$(( WORK_MIN * 60 ))
          D="$RUNNER_TEMP/actx"
          echo "软超时 ${SOFT_SEC}s (有效时长 ${WORK_MIN}min; job 上限另留 20min 给缓存归档)"
          nohup bash -c "timeout -k 60 $SOFT_SEC bash '$D/p.sh'; echo \$? > '$D/session.rc'" \
            > "$D/session.log" 2>&1 < /dev/null &
          echo $! > "$D/session.pid"
          disown 2>/dev/null || true
          sleep 2
          P=$(cat "$D/session.pid")
          if kill -0 "$P" 2>/dev/null; then
            echo "✓ 会话已后台启动 (pid $P) → 缓存下载/解密在背后进行, 不挡登录"
          else
            echo "::warning::会话启动即退出 (rc=$(cat "$D/session.rc" 2>/dev/null || echo '?'))"
          fi

      - name: 恢复加密缓存(与会话并行)
        if: github.event.inputs.cache != '0' && steps.prep.outputs.cachedir != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.prep.outputs.cachedir }}
          key: ${{ runner.os }}-actcache-ct-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-actcache-ct-

      - name: 解密并展开缓存
        if: github.event.inputs.cache != '0' && steps.prep.outputs.cachedir != ''
        env:
          CD: ${{ steps.prep.outputs.cachedir }}
        run: |
          set -uo pipefail
          K="$RUNNER_TEMP/actkey"
          if [ ! -s "$CD/lc.tar.ct" ] || [ ! -s "$CD/k.ct" ]; then
            echo "无可用缓存(首次运行或未命中) → 从空开始"
            exit 0
          fi
          if ! ACT_CACHE_K=$(openssl smime -decrypt -inform DER -inkey "$K/key.pem" -in "$CD/k.ct" 2>/dev/null); then
            echo "::warning::缓存密钥解不开(Secret 里的私钥与 repo 里的公钥不是同一对?) → 跳过缓存"
            exit 0
          fi
          export ACT_CACHE_K
          ST="$HOME/.actcache-incoming"; rm -rf "$ST"; mkdir -p "$ST"
          if openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ACT_CACHE_K -in "$CD/lc.tar.ct" \
               | tar -C "$ST" -xf -; then
            if [ ! -e "$HOME/local-cache" ]; then
              mv "$ST/local-cache" "$HOME/local-cache"
            else
              cp -a "$ST/local-cache/." "$HOME/local-cache/"
            fi
            rm -rf "$ST"
            echo "✓ 缓存已就位: $(du -sh "$HOME/local-cache" 2>/dev/null | cut -f1)"
          else
            rm -rf "$ST"
            echo "::warning::缓存解密/展开失败 → 跳过本次缓存"
          fi

      - name: 等待会话结束
        run: |
          set -uo pipefail
          D="$RUNNER_TEMP/actx"
          P=$(cat "$D/session.pid" 2>/dev/null || echo "")
          if [ -z "$P" ]; then echo "::error::没有会话 pid"; exit 1; fi
          while kill -0 "$P" 2>/dev/null; do sleep 5; done
          rc=$(cat "$D/session.rc" 2>/dev/null || echo 0)
          case "$rc" in ''|*[!0-9]*) rc=0 ;; esac
          echo "会话已结束 (rc=$rc)"
          echo "--- 会话日志尾部 ---"; tail -n 200 "$D/session.log" 2>/dev/null || true
          exit "$rc"

      - name: 打包 + 加密缓存
        if: always() && github.event.inputs.cache != '0' && steps.prep.outputs.cachedir != ''
        env:
          CD: ${{ steps.prep.outputs.cachedir }}
        run: |
          set -uo pipefail
          K="$RUNNER_TEMP/actkey"
          if [ ! -d "$HOME/local-cache" ]; then echo "没有 ~/local-cache → 不保存"; exit 0; fi
          if [ ! -s "$K/cert.pem" ]; then echo "::warning::没有公钥 → 不保存缓存"; exit 0; fi
          rm -f "$CD/lc.tar.ct" "$CD/k.ct"
          ACT_CACHE_K=$(openssl rand -hex 32); export ACT_CACHE_K
          echo "打包 + 单流加密 (tar | openssl enc)..."
          set +e
          tar --warning=no-file-changed -C "$HOME" -cf - local-cache | \
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ACT_CACHE_K > "$CD/lc.tar.ct"
          ps=("${PIPESTATUS[@]}")
          set -e
          if [ "${ps[0]}" -le 1 ] && [ "${ps[1]}" -eq 0 ] && [ -s "$CD/lc.tar.ct" ]; then
            printf '%s' "$ACT_CACHE_K" | openssl smime -encrypt -aes256 -binary -outform DER \
              "$K/cert.pem" > "$CD/k.ct"
            echo "✓ 密文 $(du -sh "$CD/lc.tar.ct" | cut -f1) 待上传(公开缓存里只有密文)"
          else
            rm -f "$CD/lc.tar.ct" "$CD/k.ct"
            echo "::warning::打包/加密失败 (tar rc=${ps[0]}, enc rc=${ps[1]}) → 本次不保存"
          fi

      - name: 保存加密缓存(总是执行)
        if: always() && github.event.inputs.cache != '0' && steps.prep.outputs.cachedir != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.prep.outputs.cachedir }}
          key: ${{ runner.os }}-actcache-ct-${{ github.run_id }}-${{ github.run_attempt }}
