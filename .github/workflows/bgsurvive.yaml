name: bg survive test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: start bg (后台进程)
        run: |
          nohup bash -c 'sleep 30; echo "bg-alive ts=$(date +%s)" > "$HOME/bg.txt"' > "$HOME/bg.log" 2>&1 < /dev/null &
          disown 2>/dev/null || true
          echo "started pid=$!"
      - name: 3s 后检查(此时应还没写)
        run: |
          sleep 3
          echo "--- after 3s ---"
          cat "$HOME/bg.txt" 2>/dev/null || echo "(还没写, 正常)"
          echo "活着的 sleep 30 进程数: $(ps -A -o command= | grep -c '[s]leep 30')"
      - name: 跨步骤等待后台进程
        run: |
          for i in $(seq 1 20); do [ -f "$HOME/bg.txt" ] && break; sleep 5; done
          echo "--- 最终 ---"
          cat "$HOME/bg.txt" 2>/dev/null || echo "❌ 后台进程没活下来(跨步骤被清理)"
